name: Release custom-windows-terminal

on:
  push:
    branches:
      - main
    paths:
      - 'windows-terminal/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate required files
        run: |
          set -euo pipefail
          echo "::group::Validate required files"
          for file in windows-terminal/assets/custom-settings.json windows-terminal/scripts/install.ps1 windows-terminal/README.md; do
            if [ ! -f "$file" ]; then
              echo "::error::missing file: $file"
              exit 1
            fi
          done
          echo "All required files are present."
          echo "::endgroup::"

      - name: Create custom-windows-terminal tag
        run: |
          set -euo pipefail
          echo "::group::Tag commit"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -f custom-windows-terminal
          git push origin custom-windows-terminal --force
          echo "::endgroup::"
