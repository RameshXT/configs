name: Release custom-k9s

on:
  push:
    branches:
      - main
    paths:
      - 'k9s/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate required files
        run: |
          set -euo pipefail
          echo "::group::Validate required files"
          for file in k9s/assets/transparent.yaml k9s/assets/view.yaml k9s/assets/wrapper.sh k9s/scripts/install.sh k9s/scripts/uninstall.sh k9s/README.md; do
            if [ ! -f "$file" ]; then
              echo "::error::missing file: $file"
              exit 1
            fi
          done
          echo "All required files are present."
          echo "::endgroup::"

      - name: Lint shell scripts
        run: |
          set -euo pipefail
          echo "::group::ShellCheck"
          sudo apt-get update && sudo apt-get install -y shellcheck
          shellcheck k9s/scripts/install.sh k9s/scripts/uninstall.sh
          echo "::endgroup::"

      - name: Package k9s folder
        run: |
          set -euo pipefail
          echo "::group::Package tarball"
          tar -czf k9s.tar.gz -C k9s .
          echo "::endgroup::"

      - name: Delete existing custom-k9s release and tag
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          echo "::group::Delete old release"
          gh release delete custom-k9s --yes --cleanup-tag || true
          echo "::endgroup::"

      - name: Create custom-k9s tag
        run: |
          set -euo pipefail
          echo "::group::Tag commit"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -f custom-k9s
          git push origin custom-k9s --force
          echo "::endgroup::"

      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          echo "::group::Create Release"
          cat << 'EOF' > release_notes.md
          ## Install & Update
          ```bash
          curl -fsSL https://raw.githubusercontent.com/RameshXT/configs/main/k9s/scripts/install.sh | bash
          ```
          
          ## Uninstall
          ```bash
          curl -fsSL https://raw.githubusercontent.com/RameshXT/configs/main/k9s/scripts/uninstall.sh | bash
          ```
          EOF
          
          gh release create custom-k9s k9s.tar.gz \
            --title "custom-k9s:latest" \
            --notes-file release_notes.md \
            --draft=false
          echo "::endgroup::"

      - name: Verify Deployment URLs
        run: |
          set -euo pipefail
          echo "::group::Install/Uninstall Instructions"
          echo "Release URL: https://github.com/RameshXT/configs/releases/tag/custom-k9s"
          echo ""
          echo "INSTALL:"
          echo "curl -fsSL https://raw.githubusercontent.com/RameshXT/configs/main/k9s/scripts/install.sh | bash"
          echo ""
          echo "UNINSTALL:"
          echo "curl -fsSL https://raw.githubusercontent.com/RameshXT/configs/main/k9s/scripts/uninstall.sh | bash"
          echo "::endgroup::"
