name: Release custom-bashrc

on:
  push:
    branches:
      - main
    paths:
      - 'bashrc/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate required files
        run: |
          set -euo pipefail
          echo "::group::Validate required files"
          for file in bashrc/assets/aws.sh bashrc/assets/aliases.sh bashrc/assets/history.sh bashrc/assets/terminal.sh bashrc/assets/aws_config.template bashrc/scripts/install.sh bashrc/scripts/uninstall.sh bashrc/README.md; do
            if [ ! -f "$file" ]; then
              echo "::error::missing file: $file"
              exit 1
            fi
          done
          echo "All required files are present."
          echo "::endgroup::"

      - name: Lint shell scripts
        run: |
          set -euo pipefail
          echo "::group::ShellCheck"
          sudo apt-get update && sudo apt-get install -y shellcheck
          shellcheck bashrc/scripts/install.sh bashrc/scripts/uninstall.sh
          echo "::endgroup::"

      - name: Package bashrc folder
        run: |
          set -euo pipefail
          echo "::group::Package tarball"
          tar -czf bashrc.tar.gz -C bashrc .
          echo "::endgroup::"

      - name: Delete existing custom-bashrc release and tag
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          echo "::group::Delete old release"
          gh release delete custom-bashrc --yes --cleanup-tag || true
          echo "::endgroup::"

      - name: Create custom-bashrc tag
        run: |
          set -euo pipefail
          echo "::group::Tag commit"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -f custom-bashrc
          git push origin custom-bashrc --force
          echo "::endgroup::"

      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          echo "::group::Create Release"
          cat << 'EOF' > release_notes.md
          ## Install & Update
          ```bash
          curl -fsSL https://raw.githubusercontent.com/RameshXT/configs/main/bashrc/scripts/install.sh | bash
          ```
          
          ## Uninstall
          ```bash
          curl -fsSL https://raw.githubusercontent.com/RameshXT/configs/main/bashrc/scripts/uninstall.sh | bash
          ```
          EOF
          
          gh release create custom-bashrc bashrc.tar.gz \
            --title "custom-bashrc:latest" \
            --notes-file release_notes.md \
            --draft=false
          echo "::endgroup::"

      - name: Verify Deployment URLs
        run: |
          set -euo pipefail
          echo "::group::Install/Uninstall Instructions"
          echo "Release URL: https://github.com/RameshXT/configs/releases/tag/custom-bashrc"
          echo ""
          echo "INSTALL:"
          echo "curl -fsSL https://raw.githubusercontent.com/RameshXT/configs/main/bashrc/scripts/install.sh | bash"
          echo ""
          echo "UNINSTALL:"
          echo "curl -fsSL https://raw.githubusercontent.com/RameshXT/configs/main/bashrc/scripts/uninstall.sh | bash"
          echo "::endgroup::"
