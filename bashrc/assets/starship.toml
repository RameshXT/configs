add_newline = false
command_timeout = 200

format = """$username$hostname$directory$git_branch$kubernetes$character"""

[username]
style_user = "blue bold"
style_root = "red bold"
format = "[$user]($style)"
show_always = true

[hostname]
ssh_only = false
style = "blue bold"
format = "[@$hostname]($style) "

[directory]
style = "white bold"
format = "[$path]($style) "
truncation_length = 3
truncate_to_repo = true

[git_branch]
symbol = ""
style = "green bold"
format = "[($branch)]($style) "

[kubernetes]
disabled = false
symbol = ""
style = "bold purple"
format = '\[[$context]\]($style)  '

[character]
success_symbol = "[❯](bold white)"
error_symbol = "[❯](bold red)"
